services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion-stagiaires-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: gestion_stagiaires
      POSTGRES_USER: gestion_stagiaires
      POSTGRES_PASSWORD: gestion_stagiaires
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion_stagiaires -d gestion_stagiaires"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
